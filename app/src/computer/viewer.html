<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private desktop</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid GrayText; }
    button { font: inherit; padding: 5px 10px; }
    #status { margin-inline-start: auto; }
    #error { margin: 0; padding: 6px 12px; color: MarkText; background: Mark; }
    main { grid-row: 3; min-height: 0; display: grid; place-items: center; overflow: hidden; }
    img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; }
    img[data-active] { cursor: crosshair; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <button id="refresh" type="button"></button>
    <button id="take" type="button"></button>
    <button id="hand-back" type="button"></button>
    <span id="status" role="status"></span>
  </header>
  <p id="error" role="alert" hidden></p>
  <main><img id="screen" tabindex="0" draggable="false" hidden></main>
  <script src="./viewer-page.js"></script>
</body>
</html>
